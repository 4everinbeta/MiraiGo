name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  publish-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            context: .
            image: miraigo-api
          - name: web
            context: ./web
            image: miraigo-web
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:latest

  deploy-railway-api:
    runs-on: ubuntu-latest
    needs: publish-images
    if: ${{ github.ref == 'refs/heads/main' && secrets.RAILWAY_TOKEN != '' && secrets.RAILWAY_API_SERVICE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g @railway/cli
      - run: railway up --service "${{ secrets.RAILWAY_API_SERVICE }}" --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  deploy-railway-web:
    runs-on: ubuntu-latest
    needs: publish-images
    if: ${{ github.ref == 'refs/heads/main' && secrets.RAILWAY_TOKEN != '' && secrets.RAILWAY_WEB_SERVICE != '' }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g @railway/cli
      - run: railway up --service "${{ secrets.RAILWAY_WEB_SERVICE }}" --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  deploy-azure-api:
    runs-on: ubuntu-latest
    needs: publish-images
    if: ${{ github.ref == 'refs/heads/main' && secrets.AZURE_API_PUBLISH_PROFILE != '' && secrets.AZURE_API_APP_NAME != '' }}
    steps:
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_API_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_API_PUBLISH_PROFILE }}
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/miraigo-api:latest

  deploy-azure-web:
    runs-on: ubuntu-latest
    needs: publish-images
    if: ${{ github.ref == 'refs/heads/main' && secrets.AZURE_WEB_PUBLISH_PROFILE != '' && secrets.AZURE_WEB_APP_NAME != '' }}
    steps:
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEB_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEB_PUBLISH_PROFILE }}
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/miraigo-web:latest
